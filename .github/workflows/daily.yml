name: Portal diario

on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Chequear hora de Berlin
        id: gate
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          echo "Hora en Berlin: $HOUR"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" != "06" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Generar la pagina
        if: steps.gate.outputs.run == 'true'
        env:
          PORTAL_FULLTEXT: "1"
        run: python build.py

      - name: Publicar en Cloudflare Pages
        if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create mi-portal --production-branch=main || echo "El proyecto ya existe, sigo igual"
          npx --yes wrangler@latest pages deploy site --project-name=mi-portal --branch=main
